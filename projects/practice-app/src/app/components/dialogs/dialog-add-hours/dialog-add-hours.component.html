<div class="c-dialog-addHours c-dialog-header">
    <div class="c-dialog-header__header">
        <span class="icon-clock u-icon-white mr-2"></span> Agregar horas de cargo
    </div>
    <mat-dialog-content>
        <div class="row">
            <div class="col-md-6">
                <div class="row">
                    <div class="col-md-6 p-0 pr-2">
                        <label class="u-title-label">Precio x Hr. </label>
                        <mat-form-field appearance="fill" class="c-form-group c-form-group__select">
                            <mat-label>Precio</mat-label>
                            <mat-select>
                                <mat-option>
                                    Option 1
                                </mat-option>
                                <mat-option>
                                    Option 2
                                </mat-option>
                                <mat-option>
                                    Option 3
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                    <div class="col-md-6 p-0 u-disable-list">
                        <label class="u-title-label">Horas cotizadas</label>
                        <mat-form-field appearance="fill" class="c-form-group c-form-group__select">
                            <mat-label>Núm. Teléfono celular</mat-label>
                            <mat-select>
                                <mat-option>
                                    Option 1
                                </mat-option>
                                <mat-option>
                                    Option 2
                                </mat-option>
                                <mat-option>
                                    Option 3
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <label class="u-title-label">Real-Time clock</label>
                <div class="c-timer-count">
                    <div class="c-timer-count__number">

                        00:00:00
                    </div>
                    <button mat-button class="c-timer-count__button">
                       <span class="icon-play"></span>
                   </button>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12">
                <div>
                    <mat-checkbox class="c-checkbox mb-3 u-fontBold u-textColor mt-3">
                        No facturable
                    </mat-checkbox>
                </div>

                <label class="u-title-label">Expediente al cual aplicará el cargo</label>
                <mat-form-field appearance="fill" class="c-form-group c-form-group__select c-form-group--small">
                    <mat-label>Nombre expediente</mat-label>
                    <mat-select>
                        <mat-option>
                            Option 1
                        </mat-option>
                        <mat-option>
                            Option 2
                        </mat-option>
                        <mat-option>
                            Option 3
                        </mat-option>
                    </mat-select>
                </mat-form-field>
                <label class="u-title-label">Descripción o detalle</label>
                <div class="c-form-group">
                    <textarea matInput class="c-form-group__textarea" style="min-height:11rem;" placeholder="Ej: Este contrato es para poder vender unas
                    máquinas de vapor etc…"></textarea>
                </div>
                <label class="u-title-label">Usuario de la firma</label>
                <mat-form-field appearance="fill" class="c-form-group c-form-group__select c-form-group--small">
                    <mat-label>Nombre expediente</mat-label>
                    <mat-select>
                        <mat-option>
                            Option 1
                        </mat-option>
                        <mat-option>
                            Option 2
                        </mat-option>
                        <mat-option>
                            Option 3
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>

    </mat-dialog-content>
    <mat-dialog-actions class="mt-auto ">
        <div class="row w-100 mb-3">
            <div class="col-md-12">
                <div class="d-flex">
                    <button mat-button class="c-btn-function flex-1">Guardar horas</button>
                    <button mat-button class="c-btn-function flex-1">Guardar y agregar nuevas <span class="icon-plus ml-2"></span></button>

                </div>
                <button mat-button mat-dialog-close class="u-link text-center m-0 w-100 mt-2 p-0">Cerrar ventana</button>
            </div>
        </div>
    </mat-dialog-actions>

</div>
