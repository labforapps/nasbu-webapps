<div class="c-dialog-newTask c-dialog-header">
    <div class="c-dialog-header__header">
        Nueva nota
    </div>
    <mat-dialog-content>

        <div class="row">
            <div class="col-md-12">
                <label class="u-title-label">Titulo de la nueva nota</label>
                <mat-form-field appearance="fill" class="c-form-group">
                    <mat-label>Titulo</mat-label>
                    <input class="c-form-group__input" matInput>
                </mat-form-field>
                <textarea rows="8" matInput class="c-form-group__textarea text-area--outlined" placeholder="Escribe aquí lo detalles"></textarea>
            </div>
        </div>

    </mat-dialog-content>
    <mat-dialog-actions class="c-dialog-header__footer">
        <button mat-button mat-dialog-close class="u-link text-center">Cerrar ventana</button>
        <button mat-button class="c-btn c-btn--outline c-btn--small">Guardar y crear otra</button>
        <button mat-button class="c-btn c-btn--primary c-btn--small">Guardar nota</button>
    </mat-dialog-actions>
</div>
