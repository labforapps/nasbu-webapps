<div class="u-smallSize mb-3 d-flex align-items-center u-gap-1 flex-wrap">
  <p>
      Este expediente contiene <b>{{documentGenerations.length}} Documentos</b>
  </p>
  <p class="u-textColor ml-auto mr-2">
      Organizado por fecha de creación
  </p>
  <div class="c-form-group--search bordered u-smallSize mt-1">
      <input matInput type="mail" placeholder="Buscar por nombre" (keyup)="searchByName($event)">
      <span class="icon-search"></span>
  </div>
</div>

<div class="table-responsive">
  <table mat-table [dataSource]="dataSource" class="c-table">
      <!-- Checkbox Column -->
      <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef class="c-table__checkbox">
              <mat-checkbox class="c-checkbox" (change)="$event ? masterToggle() : null" [checked]="selection.hasValue() && isAllSelected()" [indeterminate]="selection.hasValue() && !isAllSelected()" [aria-label]="checkboxLabel()">
              </mat-checkbox>
          </th>
          <td mat-cell *matCellDef="let row">
              <mat-checkbox class="c-checkbox" (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null" [checked]="selection.isSelected(row)" [aria-label]="checkboxLabel(row)">
              </mat-checkbox>
          </td>
      </ng-container>

      <!-- Position Column -->
      <ng-container matColumnDef="position">
          <th mat-header-cell *matHeaderCellDef> No. </th>
          <td mat-cell *matCellDef="let element"> {{element.position}} </td>
      </ng-container>

      <!-- Type Column -->
      <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef class="c-table__icontype"> Tipo </th>
          <td mat-cell *matCellDef="let element" class="text-center"> <img class="c-table__icon" src="../../../../assets/images/table-icons/paper.svg" alt=""> </td>
      </ng-container>

      <!-- task Column -->
      <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef style="min-width: 20rem;"> Nombre documento </th>
          <td mat-cell *matCellDef="let element">
              {{element.name}}
          </td>
      </ng-container>

      <!-- Estatus Column -->
      <ng-container matColumnDef="taskType">
          <th mat-header-cell *matHeaderCellDef> Tipo de archivo </th>
          <td mat-cell *matCellDef="let element"> Word microsoft </td>
      </ng-container>

      <!-- Date Column -->
      <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef> Fecha Creación </th>
          <td mat-cell *matCellDef="let element"> {{element.created_at | date}} </td>
      </ng-container>

      <!-- Date Column -->
      <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef class="text-center-force"> Acciones </th>
          <td mat-cell *matCellDef="let element" class="text-center">

              <mat-button-toggle-group class="c-btn-table">
                  <mat-button-toggle (click)="previewDocument(element)">Pre-visualizar</mat-button-toggle>
                  <mat-button-toggle [matMenuTriggerFor]="dropdownMenuOne">
                      <span class="icon-arrow-down"></span>
                  </mat-button-toggle>
              </mat-button-toggle-group>

              <mat-menu #dropdownMenuOne="matMenu" class="c-table__matMenu c-table__matMenu--bigger">
                  <button mat-menu-item class="matMenu-red" (click)="openDialogNewDocument(element)">Editar<span class="icon-pen"></span></button>
                  <button mat-menu-item class="matMenu-red" (click)="deleteDocument(element)">Eliminar <span class="icon-trash"></span></button>
                  <button mat-menu-item class="matMenu-green" (click)="downloadDocument(element)">Descargar PDF<span class="icon-download"></span></button>
                  <button mat-menu-item class="matMenu-blue" (click)="openNewTab(element)">Abrir en otra pestaña<span class="icon-new-tab"></span></button>
              </mat-menu>
          </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selection.toggle(row)">
      </tr>
  </table>
  <mat-paginator #paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20, 50]" [showFirstLastButtons]="true">
  </mat-paginator>

</div>
