<div class="d-flex u-gap-1 u-smallSize mb-3 align-items-center flex-wrap">
  <p>Este listado contiene <b>{{expedientTypes && expedientTypes.length  ? expedientTypes.length : 0 }} elementos</b></p>

  <div class="c-form-group--search bordered u-smallSize ml-auto mt-1 ">
    <input matInput type="mail" placeholder="{{'clients.pending_issues.table_header.search' | translate}}..." >
    <span class="icon-search"></span>
  </div>

  <button class="c-btn-function" mat-button [routerLink]="'/expedient-type'">Añadir nuevo tipo<span class="icon-plus ml-2 "></span></button>

</div>

<div class="table-responsive">
  <table mat-table [dataSource]="dataSource" class="c-table">
      <!-- Checkbox Column -->
      <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef class="c-table__checkbox">
              <mat-checkbox class="c-checkbox" (change)="$event ? masterToggle() : null" [checked]="selection.hasValue() && isAllSelected()" [indeterminate]="selection.hasValue() && !isAllSelected()" [aria-label]="checkboxLabel()">
              </mat-checkbox>
          </th>
          <td mat-cell *matCellDef="let row">
              <mat-checkbox class="c-checkbox" (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null" [checked]="selection.isSelected(row)" [aria-label]="checkboxLabel(row)">
              </mat-checkbox>
          </td>
      </ng-container>

      <!-- Position Column -->
      <ng-container matColumnDef="position">
          <th mat-header-cell *matHeaderCellDef> No. </th>
          <td mat-cell *matCellDef="let element"> {{element.position}} </td>
      </ng-container>

      <!-- Type Column -->
      <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef class="c-table__icontype"> Tipo </th>
          <td mat-cell *matCellDef="let element" class="text-center"> <img class="c-table__icon" src="../../../../assets/images/table-icons/contract.svg" alt=""> </td>
      </ng-container>

      <!-- task Column -->
      <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef style="min-width: 20rem;"> Descripción </th>
          <td mat-cell *matCellDef="let element">
              {{element.name}}
          </td>
      </ng-container>

      <!-- Estatus Column -->
      <ng-container matColumnDef="taskType">
          <th mat-header-cell *matHeaderCellDef> Tipo de archivo </th>
          <td mat-cell *matCellDef="let element"> Variables</td>
      </ng-container>

      <!-- Date Column -->
      <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef> Fecha subida documento </th>
          <td mat-cell *matCellDef="let element"> {{element.created_at | date}} </td>
      </ng-container>

      <!-- Date Column -->
      <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef class="text-center-force"> Acciones </th>
          <td mat-cell *matCellDef="let element" class="text-center">

              <mat-button-toggle-group class="c-btn-table">
                  <mat-button-toggle [routerLink]="['/expedient-type',element.uuid]">Ver</mat-button-toggle>
                  <mat-button-toggle [matMenuTriggerFor]="dropdownMenuOne">
                      <span class="icon-arrow-down"></span>
                  </mat-button-toggle>
              </mat-button-toggle-group>

              <mat-menu #dropdownMenuOne="matMenu" class="c-table__matMenu c-table__matMenu--bigger">
                  <button mat-menu-item class="matMenu-red" [routerLink]="['/expedient-type',element.uuid]">Editar <span class="icon-pen"></span></button>
                  <button mat-menu-item class="matMenu-red" (click)="deleteTemplateType(element)">Eliminar <span class="icon-trash"></span></button>

              </mat-menu>
          </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selection.toggle(row)">
      </tr>
  </table>
  <mat-paginator #paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20, 50]" [showFirstLastButtons]="true">
  </mat-paginator>

</div>
