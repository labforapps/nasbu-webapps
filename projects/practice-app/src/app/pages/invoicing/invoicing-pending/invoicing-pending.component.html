<div class="u-smallSize mb-3 d-flex align-items-center u-gap-1 flex-wrap">
    <p>
        <b>Tienes 4 Facturas</b> Para enviar al cliente
    </p>
    <p class="u-textColor ml-auto mr-2">
        Organizado por fecha de creación
    </p>
    <div class="c-form-group--search bordered u-smallSize mt-1">
        <input matInput type="mail" placeholder="Buscar por nombre">
        <span class="icon-search"></span>
    </div>
</div>

<div class="u-table-responsive">
    <table mat-table [dataSource]="dataSource" class="c-table">
        <!-- Checkbox Column -->
        <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef class="c-table__checkbox">
                <mat-checkbox class="c-checkbox" (change)="$event ? masterToggle() : null" [checked]="selection.hasValue() && isAllSelected()" [indeterminate]="selection.hasValue() && !isAllSelected()" [aria-label]="checkboxLabel()">
                </mat-checkbox>
            </th>
            <td mat-cell *matCellDef="let row">
                <mat-checkbox class="c-checkbox" (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null" [checked]="selection.isSelected(row)" [aria-label]="checkboxLabel(row)">
                </mat-checkbox>
            </td>
        </ng-container>

        <!-- Position Column -->
        <ng-container matColumnDef="position">
            <th mat-header-cell *matHeaderCellDef> No. </th>
            <td mat-cell *matCellDef="let element"> {{element.position}} </td>
        </ng-container>

        <!-- Type Column -->
        <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef class="c-table__icontype"> Tipo </th>
            <td mat-cell *matCellDef="let element" class="text-center"> <img class="c-table__icon" src="../../../../assets/images/table-icons/invoice-approved.svg" alt=""> </td>
        </ng-container>

        <ng-container matColumnDef="number">
            <th mat-header-cell *matHeaderCellDef class="text-center"> #No. Fact. </th>
            <td mat-cell *matCellDef="let element"  class="text-center">
                {{element.number}}
            </td>
        </ng-container>
        <!-- task Column -->
        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef > Estatus </th>
            <td mat-cell *matCellDef="let element" class="u-textLightBlue u-fontBold">
                {{element.status}}
            </td>
        </ng-container>

        <!-- Estatus Column -->
        <ng-container matColumnDef="expedient">
            <th mat-header-cell *matHeaderCellDef> Expediente </th>
            <td mat-cell *matCellDef="let element" class="u-link c-table__truncate"> {{element.expedient}} </td>
        </ng-container>

        <ng-container matColumnDef="client">
            <th mat-header-cell *matHeaderCellDef> Cliente </th>
            <td mat-cell *matCellDef="let element" class="u-link"> {{element.client}} </td>
        </ng-container>

        <!-- Date Column -->
        <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef> Fecha </th>
            <td mat-cell *matCellDef="let element"> {{element.date}} </td>
        </ng-container>

        <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef> Monto factura </th>
            <td mat-cell *matCellDef="let element"> {{element.amount}} </td>
        </ng-container>

        <!-- Date Column -->
        <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef class="text-center-force"> Acciones </th>
            <td mat-cell *matCellDef="let element" class="text-center">

                <mat-button-toggle-group class="c-btn-table">
                    <mat-button-toggle (click)="openDialogSendInvoice()">Enviar</mat-button-toggle>
                    <mat-button-toggle [matMenuTriggerFor]="dropdownMenuOne">
                        <span class="icon-arrow-down"></span>
                    </mat-button-toggle>
                </mat-button-toggle-group>

                <mat-menu #dropdownMenuOne="matMenu" class="c-table__matMenu">
                    <button mat-menu-item class="matMenu-yellow">Editar<span class="icon-pen"></span></button>
                    <button mat-menu-item class="matMenu-red">Eliminar <span class="icon-trash"></span></button>
                    <button mat-menu-item class="matMenu-blue">Aplicar pago<span class="icon-payment"></span></button>
                    <button mat-menu-item class="matMenu-green">Ver factura<span class="icon-invoice"></span></button>
                    <button mat-menu-item class="matMenu-blue">Enviar recibo<span class="icon-receipt"></span></button>
                </mat-menu>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selection.toggle(row)">
        </tr>
    </table>
</div>
