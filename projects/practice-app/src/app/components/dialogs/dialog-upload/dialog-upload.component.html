<div class="c-dialog-newTask c-dialog-header">
    <div class="c-dialog-header__header">
        {{'dockets.profile.documents.upload_new_file' | translate}}
    </div>

    <form [formGroup]="caseFileDocumentForm" (ngSubmit)="submitForm()" #form="ngForm">

        <mat-dialog-content>

          <div class="row">
              <div class="col-md-12">
                  <label class="u-title-label">{{'dockets.profile.documents.filename' | translate}}</label>
                  <mat-form-field appearance="fill" class="c-form-group">
                      <mat-label>{{'dockets.profile.documents.name' | translate}}</mat-label>
                      <input class="c-form-group__input" matInput placeholder="Ej: Crear contrato de servicio" formControlName="document_name">
                  </mat-form-field>

                  <label class="u-title-label">{{'dockets.profile.documents.description_or_details' | translate}}</label>
                  <ngx-awesome-uploader class="c-uploadFile" [enableAutoUpload]="false" [fileMaxCount]="1" (fileAdded)="onFileAdded($event)">
                  </ngx-awesome-uploader>
              </div>
          </div>

      </mat-dialog-content>
      <mat-dialog-actions class="c-dialog-header__footer">
          <button mat-button mat-dialog-close class="u-link text-center">{{'dockets.profile.documents.close_window' | translate}}</button>
          <button mat-button class="c-btn c-btn--primary c-btn--small">{{'dockets.profile.documents.upload_document' | translate}}</button>
      </mat-dialog-actions>

    </form>

</div>
