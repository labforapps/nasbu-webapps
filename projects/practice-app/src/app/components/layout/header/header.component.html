<header class="c-header">
    <img src="../../../../assets/images/logo-color.svg" alt="" class="c-header__logo">

    <div class="c-header__content">

        <div class="c-timer-count c-timer-count--small is-active">
            <div>
                <div class="c-timer-count__number">00:00:00</div>
                <div class="c-timer-count__title">Timer</div>
            </div>
            <button mat-button class="c-timer-count__button">
               <span class="icon-play"></span>
           </button>
        </div>

        <button mat-button [matMenuTriggerFor]="menu" class="c-notification">
            <div>
                <div class="c-notification__title">Notificaciones</div>
                <div class="c-notification__subtitle">Aún sin leer</div>
            </div>
            <div class="c-notification__icon">
                <span matBadge="4" matBadgeOverlap="false"><span class="icon-bell"></span></span>
            </div>
        </button>
        <mat-menu #menu="matMenu" class="c-notification-menu">
            <div class="c-notification-menu__header">
                <div class="c-notification-menu__title">Notificaciones</div>
                <div class="c-notification-menu__subtitle">Tienes <b class="u-primaryColor">2</b> nuevas actualizaciones</div>
            </div>
            <div class="c-nofitication-menu__body">
                <div class="c-notification-menu__item">
                    <span class="icon-bell c-notification-menu__icon"></span>
                    <div class="flex-1">
                        <div class="c-notification-menu__text">Se ha añadido una nueva tarea</div>
                        <div class="c-notification-menu__subtext">Llamada Raúl comprés''</div>
                    </div>
                    <div class="c-notification-menu__date">Hace 5 min</div>
                </div>
                <div class="c-notification-menu__item">
                    <span class="icon-bell c-notification-menu__icon"></span>
                    <div class="flex-1">
                        <div class="c-notification-menu__text">Se ha añadido una nueva tarea</div>
                        <div class="c-notification-menu__subtext">Llamada Raúl comprés''</div>
                        <div class="c-notification-menu__subtext u-textColor"><b>Expediente:</b> Contrato de Arrendamiento permisivo</div>
                    </div>
                    <div class="c-notification-menu__date">Hace 5 min</div>
                </div>
            </div>
            <div class="c-notification-menu__footer">
                <button mat-button>
                    Cerrar ventana
                </button>
            </div>
        </mat-menu>



        <div class="c-header__user">
            <div class="text-right">
                <div class="c-header__name">Manuel Pérez</div>
                <div class="c-header__role">usuario </div>
            </div>
            <img src="../../../../assets/images/user.jpg" alt="" class="c-header__image">

        </div>
    </div>
</header>
