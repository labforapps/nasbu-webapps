<div class=" c-dialog-header c-dialog-history">
    <div class="c-dialog-header__header">
        <div class="align-items-center d-flex u-gap-1">
            <span class="icon-send u-icon-white mr-3"></span>
            <div>
                <div>{{'clients.client_intake.registration_form_submition' | translate}}</div>
                <div class="u-smallSize u-fontRegular mt-1">{{'clients.client_intake.choose_one_option' | translate}}</div>
            </div>

        </div>
    </div>
    <mat-dialog-content class="pr-5 pl-5 pt-0">
        <div class="row mb-5">
            <div class="col-md-12">
                <label class="u-title-label d-block mt-3">{{'clients.client_intake.What_sending_method_will_you_use' | translate}}</label>
                <mat-radio-group aria-label="Select an option">
                    <mat-radio-button class="c-radioButton mr-3" value="1">{{'clients.client_intake.email' | translate}}</mat-radio-button>
                    <mat-radio-button class="c-radioButton" value="2">SMS</mat-radio-button>
                </mat-radio-group>

            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <label class="u-title-label">{{'clients.client_intake.customer_email' | translate}}</label>
                <mat-form-field appearance="fill" class="c-form-group c-form-group--small">
                    <mat-label>Email</mat-label>
                    <input class="c-form-group__input" matInput placeholder="Ej:  juan@nasbu.com">
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <label class="u-title-label">{{'clients.client_intake.customer_cellphone' | translate}}</label>
                <mat-form-field appearance="fill" class="c-form-group c-form-group--small">
                    <mat-label>{{'clients.client_intake.phone_number' | translate}} </mat-label>
                    <input class="c-form-group__input" matInput>
                </mat-form-field>
            </div>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions class="c-dialog-header__footer">
        <button mat-button mat-dialog-close class="u-link text-center">{{'clients.client_intake.close_window' | translate}}</button>
        <button mat-button class="c-btn c-btn--primary c-btn--small pr-5 pl-5" (click)="openDialogRecovery()">{{'clients.client_intake.send' | translate}}</button>
    </mat-dialog-actions>
</div>
