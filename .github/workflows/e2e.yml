name: E2E (Playwright)

# Corre contra QA (dev.nasbulegal.com), no contra el código del PR: valida que lo desplegado en QA
# siga funcionando. El smoke va en cada PR; el suite completo, todas las noches y a demanda.
on:
  pull_request:
    branches: [develop, master]
  schedule:
    - cron: '0 9 * * 1-5' # 05:00 en Santo Domingo, de lunes a viernes
  workflow_dispatch:
    inputs:
      grep:
        description: 'Filtro de pruebas (vacío = todas). Ej: @smoke, NAS-021, CLI-'
        required: false
        default: ''

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e
    env:
      CI: 'true'
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://dev.nasbulegal.com' }}
      E2E_API_URL: ${{ vars.E2E_API_URL || 'https://apidev.nasbulegal.com/api' }}
      E2E_OWNER_ULTIMATE_USER: ${{ secrets.E2E_OWNER_ULTIMATE_USER }}
      E2E_OWNER_ULTIMATE_PASSWORD: ${{ secrets.E2E_OWNER_ULTIMATE_PASSWORD }}
      E2E_OWNER_STARTER_USER: ${{ secrets.E2E_OWNER_STARTER_USER }}
      E2E_OWNER_STARTER_PASSWORD: ${{ secrets.E2E_OWNER_STARTER_PASSWORD }}
      E2E_OWNER_LIMITE_USER: ${{ secrets.E2E_OWNER_LIMITE_USER }}
      E2E_OWNER_LIMITE_PASSWORD: ${{ secrets.E2E_OWNER_LIMITE_PASSWORD }}
      E2E_COLAB_ESCRITURA_USER: ${{ secrets.E2E_COLAB_ESCRITURA_USER }}
      E2E_COLAB_ESCRITURA_PASSWORD: ${{ secrets.E2E_COLAB_ESCRITURA_PASSWORD }}
      E2E_COLAB_LECTURA_USER: ${{ secrets.E2E_COLAB_LECTURA_USER }}
      E2E_COLAB_LECTURA_PASSWORD: ${{ secrets.E2E_COLAB_LECTURA_PASSWORD }}
      E2E_COLAB_SIN_EXPEDIENTE_USER: ${{ secrets.E2E_COLAB_SIN_EXPEDIENTE_USER }}
      E2E_COLAB_SIN_EXPEDIENTE_PASSWORD: ${{ secrets.E2E_COLAB_SIN_EXPEDIENTE_PASSWORD }}
      E2E_SUSCRIPCION_IMPAGA_USER: ${{ secrets.E2E_SUSCRIPCION_IMPAGA_USER }}
      E2E_SUSCRIPCION_IMPAGA_PASSWORD: ${{ secrets.E2E_SUSCRIPCION_IMPAGA_PASSWORD }}
      E2E_SUSCRIPCION_SUSPENDIDA_USER: ${{ secrets.E2E_SUSCRIPCION_SUSPENDIDA_USER }}
      E2E_SUSCRIPCION_SUSPENDIDA_PASSWORD: ${{ secrets.E2E_SUSCRIPCION_SUSPENDIDA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run typecheck

      - name: Elegir pruebas
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "grep=@smoke" >> "$GITHUB_OUTPUT"
          else
            echo "grep=${{ github.event.inputs.grep }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Correr Playwright
        run: |
          if [ -n "${{ steps.scope.outputs.grep }}" ]; then
            npx playwright test --grep "${{ steps.scope.outputs.grep }}"
          else
            npx playwright test
          fi

      - name: Publicar reporte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
