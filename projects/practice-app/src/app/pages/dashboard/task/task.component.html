<div class="d-flex align-items-center justify-content-between mb-3 flex-wrap u-gap-1 u-smallSize">
    <p>Tienes <b class="u-primary-color">10</b> 10 tareas repartidas entre <b>vencidas y próximas a vencer</b> </p>
    <button mat-button class="mr-auto c-btn-delete">Eliminiar <span class="icon-trash"></span></button>
    <p class="u-textColor">Lista ordenada de más próxima a más antigua</p>
</div>

<div class="u-table-responsive">
    <table mat-table [dataSource]="dataSource" class="c-table">
        <!-- Checkbox Column -->
        <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef class="c-table__checkbox">
                <mat-checkbox class="c-checkbox" (change)="$event ? masterToggle() : null" [checked]="selection.hasValue() && isAllSelected()" [indeterminate]="selection.hasValue() && !isAllSelected()" [aria-label]="checkboxLabel()">
                </mat-checkbox>
            </th>
            <td mat-cell *matCellDef="let row">
                <mat-checkbox class="c-checkbox" (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null" [checked]="selection.isSelected(row)" [aria-label]="checkboxLabel(row)">
                </mat-checkbox>
            </td>
        </ng-container>

        <!-- Position Column -->
        <ng-container matColumnDef="position">
            <th mat-header-cell *matHeaderCellDef> No. </th>
            <td mat-cell *matCellDef="let element"> {{element.position}} </td>
        </ng-container>

        <!-- Type Column -->
        <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef class="c-table__icontype"> Tipo </th>
            <td mat-cell *matCellDef="let element" class="text-center"> <img class="c-table__icon" src="../../../../assets/images/document.svg" alt=""> </td>
        </ng-container>

        <!-- task Column -->
        <ng-container matColumnDef="task">
            <th mat-header-cell *matHeaderCellDef> Tarea </th>
            <td mat-cell *matCellDef="let element" class="w-20">
                <div class="u-link">{{element.task}} </div>
            </td>
        </ng-container>

        <!-- Estatus Column -->
        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef> Estatus </th>
            <td mat-cell *matCellDef="let element"> {{element.status}} </td>
        </ng-container>

        <!-- Expedient Column -->
        <ng-container matColumnDef="expedient">
            <th mat-header-cell *matHeaderCellDef> Expediente ó caso </th>
            <td mat-cell *matCellDef="let element">
                <div class="u-link c-table__truncate">{{element.expedient}}</div>
            </td>
        </ng-container>

        <!-- Date Column -->
        <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef> Fech. Vencimiento </th>
            <td mat-cell *matCellDef="let element"> {{element.date}} </td>
        </ng-container>

        <!-- Date Column -->
        <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef class="text-center-force"> Acciones </th>
            <td mat-cell *matCellDef="let element" class="text-center">

                <mat-button-toggle-group class="c-btn-table">
                    <mat-button-toggle>Button 1</mat-button-toggle>
                    <mat-button-toggle [matMenuTriggerFor]="dropdownMenuOne">
                        <span class="icon-arrow-down"></span>
                    </mat-button-toggle>
                </mat-button-toggle-group>

                <mat-menu #dropdownMenuOne="matMenu">
                    <button mat-menu-item>One</button>
                    <button mat-menu-item>Two</button>
                    <button mat-menu-item>Three</button>
                </mat-menu>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selection.toggle(row)">
        </tr>
    </table>
</div>
