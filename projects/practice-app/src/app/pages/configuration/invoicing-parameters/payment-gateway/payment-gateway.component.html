<div class="d-flex justify-content-between align-items-center mt-3 flex-wrap">
  <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap">
    <div class="l-configuration__title">
        <span class="icon-lock mr-2 u-icon-yellow"></span> Configuración merchant de pago
    </div>
</div>
<div class="l-page__controls">
  <button class="c-btn-function" type="button" mat-button (click)="openDialogAddPaymentGateway()" >Agregar merchant<span class="icon-plus ml-2 "></span></button>
</div>

</div>


<div class="mt-3">


  <table mat-table [dataSource]="dataSource" class="c-table">
    <!-- Checkbox Column -->
    <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef class="c-table__checkbox">
            <mat-checkbox class="c-checkbox" (change)="$event ? masterToggle() : null" [checked]="selection.hasValue() && isAllSelected()" [indeterminate]="selection.hasValue() && !isAllSelected()" [aria-label]="checkboxLabel()">
            </mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row">
            <mat-checkbox class="c-checkbox" (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null" [checked]="selection.isSelected(row)" [aria-label]="checkboxLabel(row)">
            </mat-checkbox>
        </td>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef> Tipo </th>
        <td mat-cell *matCellDef="let element"> 1 </td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef> Tipo </th>
      <td mat-cell *matCellDef="let element"> 1 </td>
  </ng-container>

    <!-- Type Column -->
    <ng-container matColumnDef="method">
        <th class="pl-5" mat-header-cell *matHeaderCellDef style="width: 35rem;">Proveedor</th>
        <td mat-cell *matCellDef="let element">
            <div class="c-creditCard">
                <div class="c-creditCard__header">
                    <span class="icon-bell"></span>
                    <div class="c-creditCard__type">{{element.franchise_name}}</div>
                    <div class="c-creditCard__ccv">CCV / CVV ***</div>
                </div>
                <div class="c-creditCard__strip"></div>
                <div class="c-creditCard__body">
                    <div class="c-creditCard__date">Fecha venc: {{element.expiration_date}}</div>
                    <div class="c-creditCard__number">XXXX-XXXX-XXXX-<b>{{element.last_four_digits}}</b></div>
                </div>
            </div>

        </td>
    </ng-container>

    <!-- task Column -->
    <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef> Merchant </th>
        <td mat-cell *matCellDef="let element">
            {{element.created_at}}
        </td>
    </ng-container>

    <!-- Estatus Column -->
    <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let element" class="u-dangerColor"> Disponible </td>
    </ng-container>

    <!-- Expedient Column -->
    <ng-container matColumnDef="priority">
        <th mat-header-cell *matHeaderCellDef> Fecha </th>
        <td mat-cell *matCellDef="let element">
            {{element.priority}}
        </td>
    </ng-container>



    <!-- Date Column -->
    <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef class="text-center-force"> Acciones </th>
        <td mat-cell *matCellDef="let element" class="text-center">

            <mat-button-toggle-group class="c-btn-table">
                <mat-button-toggle>Editar</mat-button-toggle>
                <mat-button-toggle [matMenuTriggerFor]="dropdownMenuOne">
                    <span class="icon-arrow-down"></span>
                </mat-button-toggle>
            </mat-button-toggle-group>

            <mat-menu #dropdownMenuOne="matMenu">
                <button mat-menu-item>One</button>
                <button mat-menu-item>Two</button>
                <button mat-menu-item>Three</button>
            </mat-menu>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selection.toggle(row)">
    </tr>
  </table>


</div>
