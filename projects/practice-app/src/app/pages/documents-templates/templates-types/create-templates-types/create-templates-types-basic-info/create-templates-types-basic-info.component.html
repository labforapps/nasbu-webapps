<div class="c-stepper-template__header">
  <img src="./assets/images/template-icon.svg" alt="" class="c-stepper-template__header__icon">
  <div class="d-flex flex-column justify-content-center">
    <div class="c-stepper-template__header__title">Creación de tipo de plantilla</div>
    <div class="c-stepper-template__header__subtitle">Completa el pasos a paso y construye tu plantilla desde cero</div>
  </div>
</div>
<div class="c-stepper-template__steps">
  <div>
    <span class="c-stepper-template__steps__title">Nombre de plantilla</span><a href="#" class="u-link">Ver como funciona</a>
  </div>
  <span>Paso 1 de 3</span>
</div>

<form action="" [formGroup]="templateTypeBasicInfoForm">

  <div class="c-stepper-template__body">
    <div class="mt-5 mb-5">
      <b class="mr-5">¿Cómo la deseas realizar?</b>
      <mat-radio-group aria-label="Select an option">
        <mat-radio-button class="c-radioButton mr-3" [checked]="true" (change)="true" value="1" #checkBox>A partir de existente</mat-radio-button>
        <mat-radio-button class="c-radioButton" value="2">Desde cero</mat-radio-button>
    </mat-radio-group>
    </div>

    <div class="mt-5 mb-5">
      <b class="mr-5">¿Requiere Firma?</b>
      <mat-radio-group aria-label="Select an option" style="margin-left: 5.5rem !important;" formControlName="require_signature">
        <mat-radio-button class="c-radioButton mr-3" [checked]="true" (change)="true" [value]="true" #checkBox>Si</mat-radio-button>
        <mat-radio-button class="c-radioButton" [value]="false">No</mat-radio-button>
    </mat-radio-group>
    </div>

    <hr class="mb-5">
    <div class="row">
      <div class="col-md-6">
        <label class="u-title-label">Codigo de la plantilla</label>
        <mat-form-field appearance="fill" class="c-form-group  c-form-group--small c-form-group--noLabel">
            <input class="c-form-group__input" matInput formControlName="code">
        </mat-form-field>
      </div>
      <div class="col-md-6">
        <label class="u-title-label">¿Cómo llamarás tu plántilla?</label>
        <mat-form-field appearance="fill" class="c-form-group  c-form-group--small c-form-group--noLabel">
            <input class="c-form-group__input" matInput formControlName="name">
        </mat-form-field>
      </div>
      <div class="col-md-6" #option *ngIf="checkBox.checked">
        <label class="u-title-label">Plantillas</label>
          <mat-form-field appearance="fill" class="c-form-group c-form-group__select c-form-group--small">
              <mat-label>Plantilla</mat-label>
              <mat-select>
                  <mat-option>
                      Option 1
                  </mat-option>
                  <mat-option>
                      Option 2
                  </mat-option>
                  <mat-option>
                      Option 3
                  </mat-option>
              </mat-select>
          </mat-form-field>
      </div>

    </div>
  </div>

</form>

<div class="c-stepper-template__footer">
  <button mat-button matStepperPrevious class="c-btn c-btn--outline-primary c-btn--medium">Cancelar</button>
  <button mat-button matStepperNext class="c-btn c-btn--primary c-btn--medium" (click)="submitForm()">Siguiente</button>
</div>
