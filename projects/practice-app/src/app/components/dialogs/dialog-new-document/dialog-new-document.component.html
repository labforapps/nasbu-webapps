<div class="c-dialog-newDocument c-dialog-header">
    <div class="c-dialog-header__header d-flex flex-column">
        Creando nuevo documento
        <span class="u-smallSize u-fontRegular">Desde plantilla: Divoricio modelo puerto rico</span>
    </div>
    <mat-dialog-content>
        <div class="row mb-2">
            <div class="col-md-6">
                <label class="u-title-label">Nombre del documento a generar</label>
                <mat-form-field appearance="fill" class="c-form-group  c-form-group--small">
                    <mat-label>Nombre del documento</mat-label>
                    <input class="c-form-group__input" matInput placeholder="Ej: Crear contrato de servicio">
                </mat-form-field>
            </div>
            <div class="col-md-6">
                <label class="u-title-label">Nombre de cliente</label>
                <mat-form-field appearance="fill" class="c-form-group c-form-group__select c-form-group--small">
                    <mat-label>Cliente</mat-label>
                    <mat-select>
                        <mat-option>
                            Option 1
                        </mat-option>
                        <mat-option>
                            Option 2
                        </mat-option>
                        <mat-option>
                            Option 3
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>
        <div class="row mb-2">
            <div class="col-md-6">
                <label class="u-title-label">Expediente al cual aplicará el cargo</label>
                <mat-form-field appearance="fill" class="c-form-group c-form-group__select c-form-group--small">
                    <mat-label>Nombre expediente</mat-label>
                    <mat-select>
                        <mat-option>
                            Option 1
                        </mat-option>
                        <mat-option>
                            Option 2
                        </mat-option>
                        <mat-option>
                            Option 3
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="col-md-6">
                <label class="u-title-label">Representante del documento</label>
                <mat-form-field appearance="fill" class="c-form-group c-form-group__select c-form-group--small" place-holder="Escoger miembro responsable de tu firma">
                    <mat-label>Mombre representante</mat-label>
                    <mat-select>
                        <mat-option>
                            Option 1
                        </mat-option>
                        <mat-option>
                            Option 2
                        </mat-option>
                        <mat-option>
                            Option 3
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>

        </div>
        <div class="row mb-2">
            <div class="col-md-6">
                <label class="u-title-label">Expiry date</label>
                <mat-form-field appearance="fill" class="c-form-group  c-form-group--small">
                    <mat-label>Expiración</mat-label>
                    <input matInput [matDatepicker]="picker">
                    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>
            </div>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions class="c-dialog-header__footer">
        <button mat-button mat-dialog-close class="u-link text-center">Cancelar</button>
        <button mat-button class="c-btn-function">Generar documento</button>
    </mat-dialog-actions>
</div>
