<div class="d-flex justify-content-between align-items-center mt-3 flex-wrap">
  <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap">
    <div class="l-configuration__title">
        <span class="icon-lock mr-2 u-icon-yellow"></span> Configuración merchant de pago
    </div>
</div>
<div class="l-page__controls">
  <button *ngxPermissionsOnly="['add_subscriptionpaymentgateway']" class="c-btn-function" type="button" mat-button (click)="openDialogSubscriptionPaymentGateway()" >Agregar merchant<span class="icon-plus ml-2 "></span></button>
</div>

</div>


<div class="mt-3">


  <table mat-table [dataSource]="dataSource" class="c-table">
    <!-- Checkbox Column -->
    <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef class="c-table__checkbox">
            <mat-checkbox class="c-checkbox" (change)="$event ? masterToggle() : null" [checked]="selection.hasValue() && isAllSelected()" [indeterminate]="selection.hasValue() && !isAllSelected()" [aria-label]="checkboxLabel()">
            </mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row">
            <mat-checkbox class="c-checkbox" (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null" [checked]="selection.isSelected(row)" [aria-label]="checkboxLabel(row)">
            </mat-checkbox>
        </td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef> Tipo </th>
      <td mat-cell *matCellDef="let element">
        <img class="c-table__icon" src="../../../../../assets/images/table-icons/invoice-pending.svg" alt="">
      </td>
  </ng-container>

    <!-- Type Column -->
    <ng-container matColumnDef="provider">
        <th class="pl-5" mat-header-cell *matHeaderCellDef style="width: 35rem;">Proveedor</th>
        <td mat-cell *matCellDef="let element">
           {{element.payment_gateway.name}}
        </td>
    </ng-container>

    <!-- task Column -->
    <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef> Fecha de creación </th>
        <td mat-cell *matCellDef="let element">
            {{element.created_at | date}}
        </td>
    </ng-container>


    <!-- Date Column -->
    <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef class="text-center-force"> Acciones </th>
        <td mat-cell *matCellDef="let element" class="text-center">

            <mat-button-toggle-group class="c-btn-table">
                <mat-button-toggle (click)="openDialogSubscriptionPaymentGateway(element)">Ver</mat-button-toggle>
                <mat-button-toggle [matMenuTriggerFor]="dropdownMenuOne">
                    <span class="icon-arrow-down"></span>
                </mat-button-toggle>
            </mat-button-toggle-group>

            <mat-menu #dropdownMenuOne="matMenu" class="c-table__matMenu">
                <button *ngxPermissionsOnly="['change_subscriptionpaymentgateway']" mat-menu-item (click)="openDialogSubscriptionPaymentGateway(element)">Editar<span class="icon-pen"></span></button>
                <button *ngxPermissionsOnly="['delete_subscriptionpaymentgateway']" mat-menu-item (click)="deleteSubscriptionPaymentGateway(element)">Borrar<span class="icon-trash"></span></button>
            </mat-menu>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selection.toggle(row)">
    </tr>
  </table>


</div>
