<div class="c-dashboard">
    <div class="c-dashboard__header">
        <div class="d-flex">
            <div class="c-dashboard__icon">
                <span class="icon-dashboard"></span>
            </div>
            <div>
                <div class="c-dashboard__title">
                    ¡Hola Manuel!
                </div>
                <div class="c-dashboard__subtitle">
                    Este es tu resumen de hoy <b class="u-textColor">4 de Marzo 2022</b>
                </div>
            </div>
        </div>
        <div class="d-flex flex-column u-textColor u-smallSize u-fontBold text-center">
            ¿Qué deseas hacer?
            <button class="c-btn-function mt-1" mat-button [matMenuTriggerFor]="menu">Funciones rápidas<span class="icon-bell ml-3 "></span></button>
            <mat-menu #menu="matMenu" class="c-btn-function__menu">
                <button mat-menu-item><span class="icon-add-user"></span>Crear nuevo cliente</button>
                <button mat-menu-item><span class="icon-task-list"></span>Crear nueva tarea</button>
                <button mat-menu-item><span class="icon-businessman-color"></span>Añadir nuevo colaborador</button>
                <button mat-menu-item><span class="icon-timer"></span>Timer </button>
                <button mat-menu-item><span class="icon-document-color"></span>Generar un documento</button>
                <button mat-menu-item><span class="icon-invoice-color"></span>Generar factura</button>
                <button mat-menu-item><span class="icon-note-pen"></span>Crear nueva nota</button>
            </mat-menu>
        </div>
    </div>
    <div class="c-dashboard-tab">
        <div class="c-dashboard-tab__header">
            <button mat-menu-item (click)="scroll(stats)" class="is-active"><span class="icon-stats-color c-dashboard-tab__icon"></span>Estadísticas</button>
            <button mat-menu-item (click)="scroll(task)"><span class="icon-hot c-dashboard-tab__icon"></span><b class="mr-1">Tareas </b>  más importantes </button>
            <button mat-menu-item (click)="scroll(invoice)"><span class="icon-money-bag c-dashboard-tab__icon"></span>Cuentas por cobrar</button>
            <button mat-menu-item (click)="scroll(notes)"><span class="icon-notes c-dashboard-tab__icon"></span>Notas recientes</button>
        </div>
        <div class="c-dashboard-tab__body">
            <div class="c-dashboard-tab__content" #stats>
                <app-indicators></app-indicators>
            </div>
            <div class="c-dashboard-tab__content" #task>
                <app-task></app-task>
            </div>
            <div class="c-dashboard-tab__content" #invoice>
                <app-task></app-task>
            </div>
            <div class="c-dashboard-tab__content" #notes>
                <div class="align-items-center d-flex flex-1 flex-column justify-content-center text-center">
                    <img class="mb-5" src="../../../assets/images/notes-blank.svg" alt="">
                    <h4 class="u-textLightColor">Ten a la mano tus últimas notas</h4>
                    <p class="u-textLightColor">Siempre es bueno ver lo último que se anotó</p>
                </div>
            </div>

        </div>
    </div>
</div>
