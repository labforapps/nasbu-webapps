<div class="c-dialog-newTask c-dialog-header">
    <div class="c-dialog-header__header">
        Subir nuevo archivo 
    </div>
    <mat-dialog-content>

        <div class="row">
            <div class="col-md-12">
                <label class="u-title-label">Nombre del archivo</label>
                <mat-form-field appearance="fill" class="c-form-group">
                    <mat-label>Nombre</mat-label>
                    <input class="c-form-group__input" matInput placeholder="Ej: Crear contrato de servicio">
                </mat-form-field>

                <label class="u-title-label">Descripción o detalle</label>
                <ngx-awesome-uploader class="c-uploadFile"></ngx-awesome-uploader>
            </div>
        </div>

    </mat-dialog-content>
    <mat-dialog-actions class="c-dialog-header__footer">
        <button mat-button mat-dialog-close class="u-link text-center">Cerrar ventana</button>
        <button mat-button class="c-btn c-btn--primary c-btn--small">Subir documento</button>
    </mat-dialog-actions>
</div>
